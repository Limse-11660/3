[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veilleur"
version = "1.0.0"
description = "Moniteur de disponibilité Ticketmaster.fr — HTTP direct uniquement (CDC v1.1)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.scripts]
veilleur = "veilleur.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
